<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Демо</title>
<script>
  // Куда ведут все QR. Сменился туннель — меняем только эту строку.
  // Демо лежит — ставим "fallback.html" (относительный путь), QR покажут заглушку.
  // Запасной: "https://enduring-device-mocha.ngrok-free.dev" (ngrok, со страницей-предупреждением)
  const BASE = "https://prakser.taila8d52c.ts.net";

  // QR: ?e=<эксперт 1–6>&t=<сценарий 1–6> → BASE/?login=<код эксперта>&tour=<сценарий>.
  // Коды печатает `python -m scripts.seed_experts --url <BASE>` на машине с сервером:
  // они зависят от backend/.experts_secret, поэтому сменилась машина — переносим сюда новые.
  // Без ?e= (обычный QR) или без кода — главная, без входа и регистрации.
  const codes = {
    "1": "196710575474",
    "2": "848935944406",
    "3": "704002825247",
    "4": "206179437218",
    "5": "247765315717",
    "6": "803235657665",
  };

  const q = new URLSearchParams(location.search);
  const code = codes[q.get("e")];
  const tour = /^[1-6]$/.test(q.get("t") ?? "") ? q.get("t") : "";
  const path = code
    ? "/?login=" + encodeURIComponent(code) + (tour ? "&tour=" + tour : "")
    : "/";
  const target = BASE.startsWith("http") ? BASE.replace(/\/$/, "") + path : BASE;
  location.replace(target);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.4 system-ui, sans-serif; background: #fff; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  a { color: inherit; }
</style>
</head>
<body>
  <p>Открываем демо… <noscript>Включите JavaScript.</noscript></p>
</body>
</html>
